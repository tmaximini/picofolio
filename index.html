<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07080A" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Picofolio — Portfolio tracker & trading journal</title>
    <meta
      name="description"
      content="Picofolio is a minimal, local-first portfolio tracker and trading journal with automatic Interactive Brokers sync. Keyboard-first, obsessively designed — your data stays on your machine."
    />
    <link rel="canonical" href="https://picofolio.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://picofolio.app/" />
    <meta property="og:site_name" content="Picofolio" />
    <meta
      property="og:title"
      content="Picofolio — Portfolio tracker & trading journal"
    />
    <meta
      property="og:description"
      content="A minimal, local-first portfolio tracker and trading journal with automatic Interactive Brokers sync. Keyboard-first, obsessively designed."
    />
    <meta property="og:image" content="https://picofolio.app/og.png" />
    <meta property="og:image:secure_url" content="https://picofolio.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Picofolio — Portfolio tracker & trading journal"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Picofolio — Portfolio tracker & trading journal"
    />
    <meta
      name="twitter:description"
      content="A minimal, local-first portfolio tracker and trading journal with automatic Interactive Brokers sync. Keyboard-first, obsessively designed."
    />
    <meta name="twitter:image" content="https://picofolio.app/og.png" />
    <meta
      name="twitter:image:alt"
      content="Picofolio — Portfolio tracker & trading journal"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Picofolio",
        "url": "https://picofolio.app/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "A minimal, local-first portfolio tracker and trading journal with automatic Interactive Brokers sync. Keyboard-first, obsessively designed.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
