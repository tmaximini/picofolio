<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07080A" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Picofolio — Portfolio Tracker &amp; Trading Journal</title>
    <meta name="description" content="Free, local-first portfolio tracker and trading journal: P&amp;L calendar, setups, allocation and returns, with automatic Interactive Brokers sync. No sign-up." />
    <link rel="canonical" href="https://picofolio.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://picofolio.app/" />
    <meta property="og:site_name" content="Picofolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Picofolio — Your portfolio, in a better light." />
    <meta property="og:description" content="A calm, keyboard-first portfolio tracker and trading journal. Local-first, free and open source, with automatic Interactive Brokers sync." />
    <meta property="og:image" content="https://picofolio.app/og.png" />
    <meta property="og:image:secure_url" content="https://picofolio.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Picofolio: “Your portfolio, in a better light.” beside the app's overview — portfolio value, return chart and holdings." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Picofolio — Your portfolio, in a better light." />
    <meta name="twitter:description" content="A calm, keyboard-first portfolio tracker and trading journal. Local-first, free and open source, with automatic Interactive Brokers sync." />
    <meta name="twitter:image" content="https://picofolio.app/og.png" />
    <meta name="twitter:image:alt" content="Picofolio: “Your portfolio, in a better light.” beside the app's overview — portfolio value, return chart and holdings." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Picofolio",
        "url": "https://picofolio.app/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web browser",
        "description": "A free, local-first portfolio tracker and trading journal with automatic Interactive Brokers sync. Keyboard-first; your data stays on your device.",
        "image": "https://picofolio.app/og.png",
        "screenshot": "https://picofolio.app/og.png",
        "isAccessibleForFree": true,
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Combined portfolio value across accounts with weekly, MTD and YTD returns",
          "Trading journal with setups, tags and weekly realized P&L",
          "P&L calendar of realized profit and loss by day",
          "Monthly returns heatmap and trading performance analytics",
          "Holdings and watchlist with multi-currency support",
          "Automatic Interactive Brokers sync via Flex Query",
          "Keyboard shortcuts and command palette",
          "Local-first storage — no account, no server-side database"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
